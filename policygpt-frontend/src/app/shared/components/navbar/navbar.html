<nav class="navbar">

  <div class="logo">
    <a [routerLink]="dashboardRoute">
      PolicyGPT
    </a>
  </div>

  <div class="nav-links">

    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        {{ item.label }}
      </a>
    }

  </div>

  <div class="nav-right">

    <span class="role">
      {{ role }}
    </span>

    <button type="button" (click)="logout()">
      Logout
    </button>

  </div>

</nav>
