<main class="min-h-screen bg-slate-100 px-6 py-8">
  <section class="mx-auto max-w-7xl">
    <div class="mb-8">
      <p class="text-sm font-semibold uppercase tracking-wide text-blue-700">
        Policy Repository
      </p>
      <h1 class="mt-2 text-4xl font-bold text-slate-900">
        Policy Search
      </h1>
      <p class="mt-2 max-w-3xl text-slate-500">
        Search, filter, and review government policies by department, state, sector, and status.
      </p>
    </div>

    <div class="grid gap-6 lg:grid-cols-[0.85fr_1.15fr]">
      <div class="space-y-6">
        <app-policy-search></app-policy-search>
        <app-policy-filter></app-policy-filter>
      </div>

      <section>
        <div class="mb-4 flex items-center justify-between">
          <h2 class="text-2xl font-semibold text-slate-900">Search Results</h2>
          <span class="inline-flex items-center gap-2 rounded-full bg-blue-100 px-4 py-2 text-sm font-semibold text-blue-800">
            <mat-icon class="text-base!">dataset</mat-icon>
            1 policy found
          </span>
        </div>

        <app-policy-card></app-policy-card>
      </section>
    </div>
  </section>
</main>
