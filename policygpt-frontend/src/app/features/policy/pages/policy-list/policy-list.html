<main class="min-h-screen bg-slate-100 px-6 py-8">

  <section class="mx-auto max-w-7xl">

    <div class="mb-8">

      <p class="text-sm font-semibold uppercase tracking-wide text-blue-700">
        Policy Repository
      </p>

      <h1 class="mt-2 text-4xl font-bold text-slate-900">
        Policy Search
      </h1>

      <p class="mt-2 max-w-3xl text-slate-500">
        Search, filter, and review government policies by department,
        state, sector and status.
      </p>

    </div>

    <div class="grid gap-6 lg:grid-cols-[0.85fr_1.15fr]">

      <!-- Left Panel -->

      <div class="space-y-6">

        <app-policy-search
          (search)="onSearch($event)">
        </app-policy-search>

       <app-policy-filter
  (filterApplied)="onFilter($event)"
  (filtersCleared)="clearFilters()">
</app-policy-filter>
      </div>

      <!-- Right Panel -->

      <section>

        <div class="mb-4 flex items-center justify-between">

          <div>

            <h2 class="text-2xl font-semibold text-slate-900">
              Search Results
            </h2>

            <p class="text-sm text-slate-500">
              {{ policies.length }} Policies Available
            </p>

          </div>

          <app-policy-toolbar
            (sortChanged)="onSort($event)">
          </app-policy-toolbar>

        </div>

        <div class="space-y-6">

          <app-policy-card
  *ngFor="let policy of pagedPolicies"
  [policy]="policy">
</app-policy-card>
        </div>
        <mat-paginator
  [length]="policies.length"
  [pageSize]="pageSize"
  [pageSizeOptions]="[5, 10, 20]"
  [pageIndex]="currentPage"
  (page)="onPageChange($event)"
  showFirstLastButtons>
</mat-paginator>

      </section>

    </div>

  </section>

</main>
