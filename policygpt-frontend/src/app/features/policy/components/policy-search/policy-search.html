<section class="rounded-2xl bg-white p-6 shadow-md">
  <div class="mb-5 flex items-center gap-3">
    <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-blue-100 text-blue-700">
      <mat-icon>search</mat-icon>
    </span>
    <div>
      <h2 class="text-xl font-semibold text-slate-900">Keyword Search</h2>
      <p class="text-sm text-slate-500">Find policies by title, benefit, ministry, or document keyword.</p>
    </div>
  </div>

  <div class="flex flex-col gap-4 sm:flex-row">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Search Policy</mat-label>
      <input matInput type="text" [(ngModel)]="keyword" placeholder="Example: education scholarship" />
      <mat-icon matSuffix>manage_search</mat-icon>
    </mat-form-field>

    <button mat-flat-button color="primary" class="h-14! rounded-xl! px-6!" (click)="searchPolicy()">
      Search
    </button>
  </div>
</section>
