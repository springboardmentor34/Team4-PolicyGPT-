<mat-card class="rounded-2xl! p-6 shadow-md!">
  <div class="flex flex-col gap-5 md:flex-row md:items-start md:justify-between">

    <div class="flex-1">

      <div class="mb-3 flex flex-wrap gap-2">
        <mat-chip>{{ policy.category }}</mat-chip>
        <mat-chip>{{ policy.state }}</mat-chip>
        <mat-chip>{{ policy.status }}</mat-chip>
      </div>

      <h3 class="text-2xl font-bold text-slate-900">
        {{ policy.policyName }}
      </h3>

      <p class="mt-3 max-w-2xl text-slate-500">
        {{ policy.description }}
      </p>

      <div class="mt-5 grid gap-3 text-sm text-slate-600 sm:grid-cols-3">

        <span class="inline-flex items-center gap-2">
          <mat-icon class="text-base! text-blue-700">
            account_balance
          </mat-icon>
          {{ policy.department }}
        </span>

        <span class="inline-flex items-center gap-2">
          <mat-icon class="text-base! text-blue-700">
            event
          </mat-icon>
          {{ policy.publicationDate }}
        </span>

        <span class="inline-flex items-center gap-2">
          <mat-icon class="text-base! text-blue-700">
            verified
          </mat-icon>
          {{ policy.status }}
        </span>

      </div>

    </div>

    <button
      mat-flat-button
      color="primary"
      class="rounded-xl! px-5! py-5!"
    >
      View Details
    </button>

  </div>
</mat-card>
