<p>policy-filter works!</p>
<h4>Advanced Filters</h4>

<div class="row">

<div class="col-md-4">

<input
class="form-control"
placeholder="Policy Name"
[(ngModel)]="filter.policyName">

</div>

<div class="col-md-4">

<input
class="form-control"
placeholder="Scheme Name"
[(ngModel)]="filter.schemeName">

</div>

<div class="col-md-4">

<input
class="form-control"
placeholder="Department"
[(ngModel)]="filter.department">

</div>

</div>

<br>

<div class="row">

<div class="col-md-4">

<input
class="form-control"
placeholder="State"
[(ngModel)]="filter.state">

</div>

<div class="col-md-4">

<input
class="form-control"
placeholder="Sector"
[(ngModel)]="filter.sector">

</div>

<div class="col-md-4">

<input
type="date"
class="form-control"
[(ngModel)]="filter.publicationDate">

</div>

</div>

<br>

<div class="row">

<div class="col-md-4">

<select
class="form-select"
[(ngModel)]="filter.status">

<option>Active</option>

<option>Draft</option>

<option>Archived</option>

</select>

</div>

</div>

<br>

<button
class="btn btn-success"
(click)="applyFilters()">

Apply Filters

</button>
