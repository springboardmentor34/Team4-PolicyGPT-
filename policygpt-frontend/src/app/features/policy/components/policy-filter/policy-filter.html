<div class="filter-heading">

  <div>
    <h2>Search Policies</h2>

    <p>
      Find policies by name, department, state, category or status.
    </p>
  </div>

</div>


<div class="filter-grid">

  <!-- Keyword -->

  <div class="filter-field keyword-field">

    <label for="policy-keyword">
      Keyword
    </label>

    <input
      id="policy-keyword"
      type="text"
      [(ngModel)]="filter.keyword"
      placeholder="Search policy name or keywords"
      (keyup.enter)="applyFilters()"
    />

  </div>


  <!-- Department -->

  <div class="filter-field">

    <label for="policy-department">
      Department
    </label>

    <input
      id="policy-department"
      type="text"
      [(ngModel)]="filter.department"
      placeholder="e.g. Agriculture Department"
    />

  </div>


  <!-- State -->

  <div class="filter-field">

    <label for="policy-state">
      State
    </label>

    <input
      id="policy-state"
      type="text"
      [(ngModel)]="filter.state"
      placeholder="e.g. Telangana"
    />

  </div>


  <!-- Category -->

  <div class="filter-field">

    <label for="policy-category">
      Category
    </label>

    <input
      id="policy-category"
      type="text"
      [(ngModel)]="filter.category"
      placeholder="e.g. Education"
    />

  </div>


  <!-- Status -->

  <div class="filter-field">

    <label for="policy-status">
      Status
    </label>

    <select
      id="policy-status"
      [(ngModel)]="filter.status">

      <option value="">
        All Statuses
      </option>

      @for (status of statuses; track status) {

        <option [value]="status">
          {{ status }}
        </option>

      }

    </select>

  </div>


  <!-- Publication Date -->

  <div class="filter-field">

    <label for="policy-publication-date">
      Publication Date
    </label>

    <input
      id="policy-publication-date"
      type="date"
      [(ngModel)]="filter.publicationDate"
    />

  </div>

</div>


<div class="filter-actions">

  <button
    type="button"
    class="search-button"
    (click)="applyFilters()">

    Search

  </button>


  <button
    type="button"
    class="clear-button"
    (click)="clearFilters()">

    Clear Filters

  </button>

</div>
