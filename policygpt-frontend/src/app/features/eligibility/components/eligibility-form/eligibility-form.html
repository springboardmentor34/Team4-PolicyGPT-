<section class="rounded-2xl bg-white p-6 shadow-md">
  <div class="mb-5 flex items-center gap-3">
    <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-blue-100 text-blue-700">
      <mat-icon>fact_check</mat-icon>
    </span>
    <div>
      <h2 class="text-xl font-semibold text-slate-900">Eligibility Form</h2>
      <p class="text-sm text-slate-500">Enter profile parameters used for scheme matching.</p>
    </div>
  </div>

  <div class="grid gap-4 md:grid-cols-2">
    <mat-form-field appearance="outline">
      <mat-label>Age</mat-label>
      <input matInput type="number" [(ngModel)]="form.age" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Gender</mat-label>
      <mat-select [(ngModel)]="form.gender">
        <mat-option value="Male">Male</mat-option>
        <mat-option value="Female">Female</mat-option>
        <mat-option value="Other">Other</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Income</mat-label>
      <input matInput type="number" [(ngModel)]="form.income" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Occupation</mat-label>
      <input matInput [(ngModel)]="form.occupation" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Education</mat-label>
      <mat-select [(ngModel)]="form.education">
        <mat-option value="10th">10th</mat-option>
        <mat-option value="12th">12th</mat-option>
        <mat-option value="Graduate">Graduate</mat-option>
        <mat-option value="Post Graduate">Post Graduate</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Location</mat-label>
      <input matInput placeholder="State / District" [(ngModel)]="form.location" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Social Category</mat-label>
      <mat-select [(ngModel)]="form.socialCategory">
        <mat-option value="General">General</mat-option>
        <mat-option value="OBC">OBC</mat-option>
        <mat-option value="SC">SC</mat-option>
        <mat-option value="ST">ST</mat-option>
        <mat-option value="EWS">EWS</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Disability Status</mat-label>
      <mat-select [(ngModel)]="form.disabilityStatus">
        <mat-option value="Yes">Yes</mat-option>
        <mat-option value="No">No</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <button mat-flat-button color="primary" class="mt-2 rounded-xl! px-6! py-5!" (click)="checkEligibility()">
    Check Eligibility
  </button>
</section>
