@if (result) {
  <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    <div class="mb-5 flex items-start justify-between gap-4">
      <div>
        <h2 class="text-xl font-semibold text-slate-900">
          Eligibility Summary
        </h2>

        <p class="mt-1 text-sm text-slate-500">
          Screening result based on the information you provided.
        </p>
      </div>

      <span
        class="status-badge"
        [class.status-eligible]="result.overallStatus === 'Eligible'"
        [class.status-review]="result.overallStatus === 'Potentially Eligible'"
        [class.status-not-eligible]="result.overallStatus === 'Not Eligible'"
      >
        {{ result.overallStatus }}
      </span>
    </div>

    <div class="grid gap-3 sm:grid-cols-3">
      <div class="rounded-xl border border-slate-200 p-4">
        <mat-icon class="text-blue-700">apps</mat-icon>

        <p class="mt-2 text-sm text-slate-500">
          Matched Schemes
        </p>

        <p class="text-2xl font-bold text-slate-900">
          {{ result.matchedSchemes }}
        </p>
      </div>

      <div class="rounded-xl border border-slate-200 p-4">
        <mat-icon class="text-emerald-700">score</mat-icon>

        <p class="mt-2 text-sm text-slate-500">
          Eligibility Score
        </p>

        <p class="text-2xl font-bold text-slate-900">
          {{ result.eligibilityScore }}%
        </p>
      </div>

      <div class="rounded-xl border border-slate-200 p-4">
        <mat-icon class="text-amber-700">verified_user</mat-icon>

        <p class="mt-2 text-sm text-slate-500">
          Confidence
        </p>

        <p class="text-2xl font-bold text-slate-900">
          {{ result.confidence }}
        </p>
      </div>
    </div>

    <mat-progress-bar
      class="mt-5"
      mode="determinate"
      [value]="result.eligibilityScore"
    ></mat-progress-bar>
  </section>
}
